  openssl-conf:
    openssl.cnf: |
      # Downgrade openssl security level to support UWCA certificates with Ubuntu 24.04
      openssl_conf = default_conf
      [ default_conf ]
      ssl_conf = ssl_sect
      [ssl_sect]
      system_default = system_default_sect
      [system_default_sect]
      MinProtocol = TLSv1.2
      CipherString = DEFAULT:@SECLEVEL=1
